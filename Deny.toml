# cargo-deny configuration for Chronacle
#
# ADR-007: License compliance + duplicate dependency check

[graph]
# Skip dev-dependencies — they don't ship in the binary
exclude-dev = true

[advisories]
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
