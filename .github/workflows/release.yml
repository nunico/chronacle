# Release pipeline for Chronacle
#
# Triggered by a semver tag push (e.g. v0.2.0).
# Stage 1 — pre-check: enforces version consistency + runs full CI suite.
# Stage 2 — build: builds native bundles on all three platforms and
#            publishes them as assets on a GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── Gate: checks + version consistency ───────────────────────────────
  pre-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend deps
        run: pnpm install --config.minimum-release-age=0

      - name: Check version consistency
        run: |
          TAG="${{ github.ref_name }}"
          CONF_VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v${CONF_VERSION}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match tauri.conf.json version ${CONF_VERSION}"
            exit 1
          fi
          echo "Tag ${TAG} matches tauri.conf.json version ${CONF_VERSION}"

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Typecheck
        working-directory: apps/desktop
        run: pnpm typecheck

      - name: Lint
        working-directory: apps/desktop
        run: pnpm lint

      - name: Frontend tests
        working-directory: apps/desktop
        run: pnpm test --run

  # ── Build + publish to GitHub Releases ───────────────────────────────
  build:
    needs: pre-check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend deps
        run: pnpm install --config.minimum-release-age=0

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Chronacle ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
