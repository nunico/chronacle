# Release pipeline for Chronacle
#
# Pull requests run release validation without building packages.
# Manual dispatches build every package without creating a release. Semver tags
# create a draft, attach all verified packages, and publish only after the complete
# native and Flatpak matrices succeed.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/flatpak/**
      - scripts/release-flatpak.sh
      - scripts/ci/test-release-flatpak.sh
      - scripts/ci/release/**
      - scripts/ci/test-pipeline.sh
      - apps/desktop/src-tauri/build.rs
      - apps/desktop/src-tauri/tauri.conf.json
      - Cargo.toml
      - Cargo.lock
      - apps/desktop/src-tauri/Cargo.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/desktop/package.json
      - apps/desktop/src-tauri/src/runtime_downloads.rs
      - apps/desktop/src-tauri/src/runtime_downloads_tests.rs
      - README.md
      - docs/user-guide.md
      - docs/architecture.md

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Discarded by Swatinem/rust-cache before it persists the cache anyway.
  CARGO_INCREMENTAL: 0

jobs:
  pre-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend deps
        run: pnpm install --config.minimum-release-age=0

      - id: version-consistency
        name: Check version consistency
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: scripts/ci/release/check-version-consistency.sh

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test RocksDB-enabled desktop suite
        run: cargo test -p Chronacle --features rocksdb

      - name: Typecheck
        working-directory: apps/desktop
        run: pnpm typecheck

      - name: Lint
        working-directory: apps/desktop
        run: pnpm lint

      - name: Frontend tests
        working-directory: apps/desktop
        run: pnpm test --run

  create-release:
    needs: pre-check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Select or create draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/release/create-release.sh

  build:
    needs: pre-check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            flatpak_arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            flatpak_arch: aarch64
          - name: macos-arm64
            os: macos-26
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev rpm cpio

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend deps
        run: pnpm install --config.minimum-release-age=0

      - name: Build native packages
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --features rocksdb
          tagName: ""
          releaseName: ""
          releaseDraft: true
          prerelease: false

      - name: Validate Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/ci/release/validate-linux-packages.sh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          FLATPAK_ARCH: ${{ matrix.flatpak_arch }}

      - name: Validate macOS packages and startup
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/ci/release/validate-macos-packages.sh
        env:
          RELEASE_TARGET: ${{ matrix.target }}

      - name: Validate Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/release/validate-windows-packages.ps1
        env:
          RELEASE_TARGET: ${{ matrix.target }}

      - name: Upload Debian package for Flatpak
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: chronacle-deb-${{ matrix.flatpak_arch }}
          path: target/${{ matrix.target }}/release/bundle/deb/Chronacle_*.deb
          if-no-files-found: error

      - name: Upload inspectable native bundles
        uses: actions/upload-artifact@v4
        with:
          name: chronacle-native-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  flatpak:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream xvfb dbus-x11

      - name: Configure Flathub and install GNOME runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --arch="${{ matrix.arch }}" flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Download matching Debian package
        uses: actions/download-artifact@v4
        with:
          name: chronacle-deb-${{ matrix.arch }}
          path: artifacts

      - name: Build and smoke-test Flatpak
        shell: bash
        run: scripts/ci/release/build-flatpak.sh

      - name: Upload inspectable Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: chronacle-flatpak-${{ matrix.arch }}
          path: flatpak-out/*.flatpak
          if-no-files-found: error

  upload-release-assets:
    needs: [create-release, build, flatpak]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: chronacle-native-*
          path: release-assets/native

      - name: Download Flatpak packages
        uses: actions/download-artifact@v4
        with:
          pattern: chronacle-flatpak-*
          path: release-assets/flatpak

      - name: Upload verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: scripts/ci/release/upload-release-assets.sh

  publish-release:
    needs: [create-release, upload-release-assets, build, flatpak]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: scripts/ci/release/publish-release.sh
