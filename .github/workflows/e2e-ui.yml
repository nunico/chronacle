# tauri-driver UI E2E (Linux only).
#
# tauri-driver supports Linux (WebKitWebDriver) and Windows (Edge) only — there
# is no macOS support — so this runs exclusively on ubuntu under Xvfb. It drives
# the real built app: real Rust backend, SurrealDB, PDF extraction and
# embeddings, with only the LLM swapped for a deterministic local stub.
#
# Heavy (release build + embedding-model download), so it runs on merge to main
# and on manual dispatch, not on every PR.
name: E2E UI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Discarded by Swatinem/rust-cache before it persists the cache anyway —
  # skip paying the on-disk cost for it on this already disk-heavy job.
  CARGO_INCREMENTAL: 0

jobs:
  e2e-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev \
            webkit2gtk-driver xvfb

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install JS dependencies
        run: pnpm install --config.minimum-release-age=0

      - name: Build app (release, via Tauri CLI)
        # Must be the Tauri CLI, not plain `cargo build`: only the CLI's
        # production build embeds the frontend (`frontendDist`) into the binary.
        # `cargo build --release` yields a binary that serves "asset not found:
        # index.html". `tauri build` runs `beforeBuildCommand` (pnpm build) too.
        working-directory: apps/desktop
        run: pnpm exec tauri build --no-bundle

      - name: Run UI E2E under Xvfb
        # --server-args: explicit screen avoids DRI3 hardware-probe delay (~30 s)
        # in software-only CI runners.
        # dbus-run-session: WebKitWebDriver needs a session bus for AT-SPI.
        run: dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm -C apps/desktop e2e:ui
