# CI pipeline for Chronacle
#
# ADR-007:
#   - On PR: cargo fmt --check → cargo clippy → cargo audit → cargo test
#   - On merge to main: additionally run coverage + build

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts inflate on-disk usage during the job but aren't
  # persisted by Swatinem/rust-cache (it strips them before saving), so
  # they're pure disk waste on ephemeral runners — disable them.
  CARGO_INCREMENTAL: 0

jobs:
  # ── Rust checks (PR + merge) ──────────────────────────────────────
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        # Don't prune docker images here: actions/runner pre-builds this
        # job's docker-based actions (e.g. cargo-deny-action) before this
        # step runs, and a later step still needs that image.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Check the crate graph
        uses: EmbarkStudios/cargo-deny-action@v2

  # ── Frontend checks (PR + merge) ──────────────────────────────────
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --config.minimum-release-age=0

      - name: Typecheck
        working-directory: apps/desktop
        run: pnpm typecheck

      - name: Lint
        working-directory: apps/desktop
        run: pnpm lint

      - name: Test
        working-directory: apps/desktop
        run: pnpm test --run

  # ── Coverage + Build (merge to main only) ─────────────────────────
  coverage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [rust-check, frontend-check]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev

      - name: Generate coverage
        run: cargo llvm-cov --workspace --html

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/llvm-cov/html/

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [rust-check, frontend-check]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev

      - name: Build
        run: cargo build --workspace --release
