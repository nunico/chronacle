[package]
name = "chronacle"
version = "0.1.0"
description = "A TTRPG GM assistant — load rules PDFs, take notes, query with cited answers."
edition = "2021"
rust-version = "1.81"

[[bin]]
name = "chronacle"
path = "src/main.rs"

[lib]
name = "chronacle_lib"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
surrealdb = { version = "2", features = ["kv-rocksdb", "kv-mem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
dirs-next = "2"
thiserror = "2"
regex = "1"
fastembed = { version = "5", features = ["ort-load-dynamic"] }
futures-util = "0.3"
unicode-segmentation = "1"
pdfium-render = { version = "0.8", features = ["thread_safe", "image"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
pretty_assertions = "1"
lopdf = "0.38"
