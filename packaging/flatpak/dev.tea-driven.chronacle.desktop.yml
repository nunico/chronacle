app-id: dev.tea-driven.chronacle.desktop
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: chronacle

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network

modules:
  - name: chronacle
    buildsystem: simple
    build-commands:
      - ar x Chronacle.deb
      - tar -xzf data.tar.gz
      - test -x usr/bin/chronacle
      - test -d usr/lib/Chronacle
      - test -f usr/share/applications/Chronacle.desktop
      - install -Dm755 usr/bin/chronacle /app/bin/chronacle
      - mkdir -p /app/lib
      - cp -a usr/lib/Chronacle /app/lib/Chronacle
      - sed -i 's/^Icon=.*/Icon=dev.tea-driven.chronacle.desktop/' usr/share/applications/Chronacle.desktop
      - install -Dm644 usr/share/applications/Chronacle.desktop /app/share/applications/dev.tea-driven.chronacle.desktop.desktop
      - for icon in usr/share/icons/hicolor/*/apps/*.png; do size="$(basename "$(dirname "$(dirname "$icon")")")"; install -Dm644 "$icon" "/app/share/icons/hicolor/$size/apps/dev.tea-driven.chronacle.desktop.png"; done
      - install -Dm644 dev.tea-driven.chronacle.desktop.metainfo.xml /app/share/metainfo/dev.tea-driven.chronacle.desktop.metainfo.xml
      - test -f /app/lib/Chronacle/resources/pdfium/libpdfium.so
      - test -f /app/lib/Chronacle/resources/onnxruntime/libonnxruntime.so
      - test -f /app/share/icons/hicolor/32x32/apps/dev.tea-driven.chronacle.desktop.png
      - test -f /app/share/icons/hicolor/128x128/apps/dev.tea-driven.chronacle.desktop.png
    sources:
      - type: file
        path: Chronacle.deb
      - type: file
        path: dev.tea-driven.chronacle.desktop.metainfo.xml
