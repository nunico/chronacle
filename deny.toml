# cargo-deny configuration for Chronacle
#
# ADR-007: License compliance + duplicate dependency check

[graph]
# Skip dev-dependencies — they don't ship in the binary
exclude-dev = true

[advisories]
# Warn rather than deny: many unmaintained/unsound crates are deep transitive deps
# from Tauri v2 / GTK3 bindings that we cannot directly upgrade.
unmaintained = "workspace"
unsound = "workspace"
ignore = [
    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml 0.39.4 DoS advisories, fixed in
    # 0.41.0. Pulled in transitively via plist v1.9.0 (Tauri's tray-icon feature, for
    # reading Info.plist). plist pins `quick-xml = "^0.39.2"` and its latest release
    # (and unreleased main, checked 2026-07-02) still has not bumped this — no fix is
    # reachable via `cargo update` until upstream releases one.
    # Risk is negligible for our usage: plist's xml_reader.rs uses a plain
    # `quick_xml::Reader`, never `NsReader` (0195 requires NsReader and doesn't apply
    # at all), and the XML being parsed is the app's own bundled Info.plist metadata,
    # not attacker-supplied input (0194's quadratic cost requires untrusted XML).
    # Revisit when plist releases a version depending on quick-xml >=0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    # Transitive deps via SurrealDB / Tauri / fastembed ecosystem
    "MPL-2.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "NCSA",
    "BUSL-1.1",
]
confidence-threshold = 0.8

[licenses.private]
# Skip license checking for workspace-local crates (they use a custom AGPL + branding exception)
ignore = true

[bans]
# Warn rather than deny: Tauri v2 + SurrealDB v2 + fastembed pull in many unavoidable
# transitive duplicate versions that we cannot resolve without upstream changes.
multiple-versions = "warn"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
