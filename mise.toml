[env]
# Frontend tooling (tauri-cli, vite, …) is installed in the apps/desktop
# workspace package; pnpm does not hoist these to the repo-root node_modules.
_.path = ['{{config_root}}/apps/desktop/node_modules/.bin']

NODE_ENV = "{{ env.NODE_ENV | default(value='development') }}"

[tools]
node = '26'
rust = '1.95'

[hooks]
postinstall = 'npm install -g pnpm@latest-11'

[tasks.pnpm-install]
description = 'Installs dependencies with pnpm'
run = 'pnpm install'
sources = ['package.json', 'pnpm-lock.yaml', 'mise.toml']
outputs = ['node_modules/.pnpm/lock.yaml']

[tasks.prebuild]
description = 'Generate icons'
dir = '{{config_root}}/apps/desktop/src-tauri'
run = 'tauri icon'
depends = ['pnpm-install']

[tasks.dev]
description = 'Run application in DEV mode'
dir = '{{config_root}}/apps/desktop'
run = 'tauri dev --features rocksdb'
depends = ['pnpm-install']

[tasks.build]
description = 'Build application package'
dir = '{{config_root}}/apps/desktop'
run = 'tauri build --features rocksdb'
depends = ['pnpm-install']

[tasks.ci-pr]
description = 'Run the complete pull-request gate in Docker'
run = 'scripts/ci/local-pr.sh'

[settings]
experimental = true
