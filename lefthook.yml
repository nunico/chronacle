# Leverage hooks (https://github.com/evilmartians/lefthook)
#
# ADR-007: Pre-commit checks run in parallel.

pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all --check
      stage_fixed: true
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    # Frontend tooling (prettier, eslint, prettier-plugin-svelte) lives in the
    # apps/desktop workspace package, so these run from there via `root:` —
    # lefthook relativizes {staged_files} to that dir and only passes files
    # under it.
    prettier:
      root: "apps/desktop/"
      glob: "*.{ts,svelte,json,css,md,yaml,yml}"
      run: pnpm exec prettier --check {staged_files}
      stage_fixed: true
    eslint:
      root: "apps/desktop/"
      glob: "*.{ts,svelte}"
      run: pnpm exec eslint {staged_files}

commit-msg:
  commands:
    text-width:
      run: |
        if [ "$(wc -c <<< "$(head -1 "$1")")" -gt 73 ]; then
          echo "Commit subject too long (max 72 chars)" >&2; exit 1
        fi
